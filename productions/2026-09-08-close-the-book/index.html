<!doctype html><html><head><meta charset="utf-8"><title>Close the Book</title><style>@font-face{font-family:Stiles;src:url(assets/DejaVuSans-Bold.ttf)}*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;background:#f3eedc;color:#254b45;overflow:hidden;font-family:Stiles}#root,.scene{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden}.art{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.018)}.heading{position:absolute;left:90px;right:90px;top:180px;font-size:80px;line-height:1.15;letter-spacing:-2px}.small{font-size:45px;line-height:1.2;letter-spacing:-1px;margin-bottom:16px;color:#5c7568}.bottom{top:1440px}.accent{color:#886220}.scene:not(#s0),.copy{opacity:0;visibility:hidden}#openingZoom{position:absolute;inset:0;transform-origin:50% 58%;}</style></head><body><div id="root" data-composition-id="closebook" data-width="1080" data-height="1920" data-start="0" data-duration="40.0" data-fps="30"><div id="s0" class="scene"><div id="openingZoom"><video id="bookHook" class="clip" src="assets/hook-ready.mp4" muted playsinline data-start="0" data-duration="3.6" data-track-index="0" style="width:1080px;height:1920px;object-fit:cover"></video></div></div><section id="s1" class="scene clip" data-start="0" data-duration="40.0" data-track-index="1"><div class="art" style="background-image:url(assets/reading.png)"></div><div id="easy" class="heading copy">Feels easy.</div></section><section id="s2" class="scene clip" data-start="0" data-duration="40.0" data-track-index="2"><div class="art" style="background-image:url(assets/blank.png)"></div><div id="recognize" class="heading copy" style="font-size:73px">Recognizing<br>≠ recalling.</div></section><section id="s3" class="scene clip" data-start="0" data-duration="40.0" data-track-index="3"><div class="art" style="background-image:url(assets/experiment.png)"></div><div id="immediate" class="heading copy" style="font-size:58px;top:120px"><div class="small">Right away</div>Rereading helped more.</div><div id="delayed" class="heading copy" style="font-size:58px;top:120px"><div class="small">Days later</div>Recall helped more.</div></section><section id="s4" class="scene clip" data-start="0" data-duration="40.0" data-track-index="4"><div class="art" style="background-image:url(assets/confidence.png)"></div><div id="confidenceText" class="heading copy" style="font-size:64px;top:175px;right:auto;width:540px">Confidence<br>≠ retention.</div></section><section id="s5" class="scene clip" data-start="0" data-duration="40.0" data-track-index="5"><div class="art" style="background-image:url(assets/recall.png)"></div><div id="recallText" class="heading copy">Recall.</div></section><section id="s6" class="scene clip" data-start="0" data-duration="40.0" data-track-index="6"><div class="art" style="background-image:url(assets/correct.png)"></div><div id="correctText" class="heading copy" style="font-size:64px;top:1540px;background:#f4eedb;padding:24px 28px;border-radius:12px">Check + correct.</div></section><section id="s7" class="scene clip" data-start="0" data-duration="40.0" data-track-index="7"><div class="art" style="background-image:url(assets/later.png)"></div><div id="laterText" class="heading copy" style="font-size:70px">Try again later.</div></section><section id="s8" class="scene clip" data-start="0" data-duration="40.0" data-track-index="8"><div class="art" style="background-image:url(assets/recall.png)"></div><div id="landing" class="heading copy" style="font-size:76px">Close.<br>Recall.<br><span class="accent">Check.</span></div></section><script src="assets/gsap.min.js"></script><script>const C={"reading": 3.05, "easy": 4.13, "blank": 6.06, "recognize": 7.57, "experiment": 9.53, "immediate": 11.94, "delayed": 14.01, "confidence": 16.5, "confidenceText": 18.53, "recall": 21.19, "recallText": 23.06, "correct": 25.54, "correctText": 26.6, "later": 28.52, "laterText": 28.82, "ending": 33.46, "landing": 36.4, "end": 40.0};const tl=gsap.timeline({paused:true});gsap.set(['.scene:not(#s0)','.copy'],{autoAlpha:0});
function enter(a,b,t){tl.to(b+' .copy',{autoAlpha:0,duration:.12},t);tl.to(a,{autoAlpha:1,duration:.24,ease:'power1.inOut'},t+.12);tl.to(b,{autoAlpha:0,duration:.24,ease:'power1.inOut'},t+.12)}
function reveal(id,t){tl.fromTo(id,{autoAlpha:0,y:10},{autoAlpha:1,y:0,duration:.28,ease:'power2.out'},t)}
function drift(id,a,b,r=false){tl.fromTo(id+' .art',{scale:r?1.032:1.018,x:r?4:-4},{scale:r?1.018:1.032,x:r?-4:4,duration:b-a,ease:'none'},a)}
// Distinct hook punch, NOT body micro-motion:100% to105%, then return.
tl.fromTo('#openingZoom',{scale:1},{scale:1.05,duration:.38,ease:'power2.out'},.08);tl.to('#openingZoom',{scale:1,duration:.55,ease:'power1.inOut'},.75);
enter('#s1','#s0',3.05);drift('#s1',3.05,6.06,false);
enter('#s2','#s1',6.06);drift('#s2',6.06,9.53,true);
enter('#s3','#s2',9.53);drift('#s3',9.53,16.5,false);
enter('#s4','#s3',16.5);drift('#s4',16.5,21.19,true);
enter('#s5','#s4',21.19);drift('#s5',21.19,25.54,false);
enter('#s6','#s5',25.54);drift('#s6',25.54,28.52,true);
enter('#s7','#s6',28.52);drift('#s7',28.52,33.46,false);
enter('#s8','#s7',33.46);drift('#s8',33.46,40.0,true);
for(const id of ['easy','recognize','immediate','confidenceText','recallText','correctText','laterText','landing'])reveal('#'+id,C[id]);
tl.to('#immediate',{autoAlpha:0,duration:.13},C.delayed);reveal('#delayed',C.delayed+.13);tl.to('#laterText',{autoAlpha:0,duration:.2},30.61);
window.__timelines=window.__timelines||{};window.__timelines.closebook=tl;</script></div></body></html>
