<script src="assets/gsap.min.js"></script><script>
const C={"meeting": 4, "stuck": 5.28, "residue": 8.29, "pressure": 11, "plan": 16.37, "note": 19.7, "where": 20.96, "next": 22.17, "when": 23.6, "example1": 25.41, "example2": 27.14, "example3": 28.35, "focused": 31.86, "end": 36.0};const tl=gsap.timeline({paused:true});gsap.set(['#s1','#s2','#s3','#s4','#stuck','#residue','#plan','#e1','#e2','#e3','.example','.label'],{autoAlpha:0});
