name: Refresh encrypted agent handoff
on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - config/**
      - '!config/transfer.json'
      - calendar/**
      - tools/**
      - .github/workflows/**
  schedule:
    - cron: '13 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: subai-calendar-publisher
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r automation/requirements.txt
      - name: Validate bootstrap and publisher regression tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild and verify encrypted archive
        env:
          HANDOFF_PASSPHRASE: ${{ secrets.HANDOFF_PASSPHRASE }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_STILES_CLIENT_ID: ${{ secrets.YOUTUBE_STILES_CLIENT_ID }}
          YOUTUBE_STILES_CLIENT_SECRET: ${{ secrets.YOUTUBE_STILES_CLIENT_SECRET }}
          YOUTUBE_STILES_REFRESH_TOKEN: ${{ secrets.YOUTUBE_STILES_REFRESH_TOKEN }}
        run: python tools/build-handoff.py --upload
      - name: Record public ciphertext metadata only
        run: |
          git config user.name 'Subai Handoff'
          git config user.email 'subai-handoff@users.noreply.github.com'
          git add config/transfer.json
          git diff --cached --quiet || git commit -m 'handoff: refresh encrypted bootstrap metadata'
          git push origin HEAD:main
      - name: Remove local encrypted intermediate
        if: always()
        run: rm -f credentials/subai-agent-bootstrap-v1.enc
